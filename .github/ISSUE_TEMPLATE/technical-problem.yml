name: Техническая проблема
description: Сообщить о проблеме установки, запуска или отображения текста
title: "[Техническая проблема]: "
body:
  - type: input
    id: game-version
    attributes:
      label: Версия игры
      placeholder: Например, 1.7.6
    validations:
      required: true
  - type: input
    id: translation-version
    attributes:
      label: Версия перевода
      placeholder: Например, v0.8.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Операционная система
      placeholder: Например, Windows 11 64-bit
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Что вы сделали
      description: Опишите установку и действия перед появлением проблемы
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Скриншот или лог
      description: Не публикуйте персональные данные, пароли или токены
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка
      options:
        - label: Я устанавливал перевод вручную по инструкции из README.
          required: true
